<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-area" aria-label="Chess game">
        <div class="top-bar">
          <div>
            <p class="eyebrow">Live board</p>
            <h1>Chess</h1>
          </div>
          <div class="controls" aria-label="Game controls">
            <button id="flipButton" type="button" title="Flip board" aria-label="Flip board">
              <span aria-hidden="true">↻</span>
            </button>
            <button id="resetButton" type="button">New game</button>
          </div>
        </div>

        <div class="board-wrap">
          <div class="rank-labels" id="rankLabels" aria-hidden="true"></div>
          <div class="board" id="board" role="grid" aria-label="Chess board"></div>
          <div class="file-labels" id="fileLabels" aria-hidden="true"></div>
        </div>
      </section>

      <aside class="side-panel" aria-label="Game details">
        <section class="status-panel">
          <p class="panel-label">Status</p>
          <h2 id="statusText">White to move</h2>
          <p id="detailText">Select a white piece to begin.</p>
        </section>

        <section>
          <div class="panel-heading">
            <h2>Captured</h2>
          </div>
          <div class="captures">
            <div>
              <p class="capture-label">White took</p>
              <div class="capture-row" id="whiteCaptures" aria-label="Pieces captured by white"></div>
            </div>
            <div>
              <p class="capture-label">Black took</p>
              <div class="capture-row" id="blackCaptures" aria-label="Pieces captured by black"></div>
            </div>
          </div>
        </section>

        <section>
          <div class="panel-heading">
            <h2>Moves</h2>
          </div>
          <ol class="move-list" id="moveList" aria-label="Move history"></ol>
        </section>
      </aside>
    </main>

    <dialog class="promotion-dialog" id="promotionDialog" aria-labelledby="promotionTitle">
      <form method="dialog">
        <h2 id="promotionTitle">Promote pawn</h2>
        <div class="promotion-options">
          <button value="q" type="submit" aria-label="Promote to queen">♕</button>
          <button value="r" type="submit" aria-label="Promote to rook">♖</button>
          <button value="b" type="submit" aria-label="Promote to bishop">♗</button>
          <button value="n" type="submit" aria-label="Promote to knight">♘</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="main.js"></script>
  </body>
</html>
