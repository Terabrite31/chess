<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalDesk Messaging</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="auth-view" id="authView">
        <div class="auth-panel">
          <div>
            <p class="eyebrow">SignalDesk</p>
            <h1>Executive-grade team messaging.</h1>
            <p class="lede">
              Secure account verification, searchable teammates, persistent conversations, unread state,
              and a file-backed local database for development.
            </p>
          </div>

          <form class="auth-card" id="authForm">
            <div class="segmented" role="tablist" aria-label="Authentication mode">
              <button class="active" type="button" data-mode="login">Sign in</button>
              <button type="button" data-mode="register">Create account</button>
            </div>

            <label class="register-only">
              Name
              <input autocomplete="name" id="nameInput" placeholder="Ari Morgan" />
            </label>

            <label>
              Email
              <input autocomplete="email" id="emailInput" placeholder="ari@company.com" required type="email" />
            </label>

            <label>
              Password
              <input autocomplete="current-password" id="passwordInput" minlength="8" required type="password" />
            </label>

            <button class="primary" type="submit" id="authSubmit">Sign in</button>
            <button class="ghost" type="button" id="resendButton">Resend verification</button>
            <p class="notice" id="authNotice"></p>
          </form>
        </div>
      </section>

      <section class="app-view hidden" id="appView">
        <aside class="sidebar">
          <div class="brand-row">
            <div>
              <p class="eyebrow">SignalDesk</p>
              <h2>Messages</h2>
            </div>
            <button class="icon-button" id="newConversationButton" title="New conversation" aria-label="New conversation">+</button>
          </div>

          <div class="status-strip">
            <span id="userName">Signed in</span>
            <button class="text-button" id="logoutButton">Log out</button>
          </div>

          <div class="search-box">
            <input id="conversationSearch" placeholder="Search conversations" />
          </div>

          <div class="conversation-list" id="conversationList"></div>
        </aside>

        <section class="thread-panel">
          <header class="thread-header">
            <div>
              <p class="eyebrow" id="threadMeta">No conversation selected</p>
              <h1 id="threadTitle">Choose a thread</h1>
            </div>
            <button class="secondary" id="refreshButton">Refresh</button>
          </header>

          <div class="messages" id="messages"></div>

          <form class="composer" id="messageForm">
            <textarea id="messageInput" placeholder="Write a focused, high-signal message..." rows="3"></textarea>
            <button class="primary" type="submit">Send</button>
          </form>
        </section>
      </section>
    </main>

    <dialog id="composeDialog">
      <form class="compose-modal" id="composeForm" method="dialog">
        <div class="modal-header">
          <div>
            <p class="eyebrow">New conversation</p>
            <h2>Start a thread</h2>
          </div>
          <button class="icon-button" type="button" id="closeCompose" aria-label="Close">x</button>
        </div>

        <label>
          Recipients
          <input id="peopleSearch" placeholder="Search verified teammates" />
        </label>
        <div class="people-results" id="peopleResults"></div>
        <div class="selected-people" id="selectedPeople"></div>

        <label>
          Subject
          <input id="subjectInput" placeholder="Launch review, vendor escalation, hiring loop..." />
        </label>

        <label>
          Priority
          <select id="priorityInput">
            <option value="normal">Normal</option>
            <option value="urgent">Urgent</option>
            <option value="executive">Executive</option>
          </select>
        </label>

        <label>
          Message
          <textarea id="firstMessageInput" rows="5" placeholder="Write the first message..."></textarea>
        </label>

        <button class="primary" type="submit">Create thread</button>
        <p class="notice" id="composeNotice"></p>
      </form>
    </dialog>

    <script type="module" src="/main.js"></script>
  </body>
</html>
